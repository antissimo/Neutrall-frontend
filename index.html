<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neutrall — vijesti</title>
  <meta name="description" content="Važne hrvatske vijesti sažete iz više medija: tko što tvrdi i u čemu se mediji razlikuju.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/serif-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/public-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#feed">Preskoči na vijesti</a>
  <header class="brand wrap">
    <div class="brand-row">
      <a class="logo" href="/" aria-label="neutrall naslovnica">neutra<span>ll</span></a>
      <a class="digest-btn" href="/sazetak">Sažetak dana</a>
    </div>
    <p class="dateline" id="dateline"></p>
  </header>

  <nav class="bar" aria-label="Filteri">
    <div class="wrap">
      <div class="tabs" id="categories" role="group" aria-label="Kategorija"></div>
      <div class="tools">
        <form class="search" id="search" role="search">
          <input type="search" id="q" name="q" maxlength="200" autocomplete="off"
                 placeholder="Pretraži po značenju, npr. poskupljenje struje" aria-label="Pretraga vijesti">
          <button type="button" class="clear" id="clear" aria-label="Obriši pretragu" hidden>×</button>
        </form>
        <div class="segmented" id="regions" role="group" aria-label="Regija"></div>
        <div class="segmented" id="tones" role="group" aria-label="Ton vijesti"></div>
      </div>
    </div>
  </nav>

  <div class="wrap layout">
    <aside class="trending" aria-labelledby="trending-h" hidden>
      <h2 id="trending-h">U trendu</h2>
      <ol id="trending"></ol>
    </aside>
    <main>
      <article id="detail" class="detail" hidden></article>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="feed" class="feed"></ol>
      <div class="more"><button id="more" type="button" hidden>Učitaj još</button></div>
    </main>
  </div>

  <footer class="wrap footer">
    <p><span class="copy">© neutrall</span> <span class="sources-label">Izvori:</span> <span id="sources" class="sources"></span></p>
  </footer>

  <template id="story-tpl">
    <li class="story">
      <a class="thread-label" hidden></a>
      <div class="meta">
        <span class="cat"></span>
        <span class="region"></span>
        <time></time>
      </div>
      <h2 class="title"><a></a></h2>
      <p class="summary"></p>
      <div class="thread-more" hidden><ul></ul><a class="thread-all"></a></div>
    </li>
  </template>
</body>
</html>
